name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - "codex/**"
      - "feature/**"
      - "fix/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  backend:
    name: Backend quality and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Check formatting
        run: ./mvnw --batch-mode spotless:check
      - name: Compile
        run: ./mvnw --batch-mode --no-transfer-progress compile
      - name: Run unit and architecture tests
        run: ./mvnw --batch-mode --no-transfer-progress test
      - name: Run PostgreSQL integration tests and package
        run: ./mvnw --batch-mode --no-transfer-progress verify -DskipUnitTests=true
      - name: Build production container
        working-directory: .
        run: docker build --file backend/Dockerfile backend
