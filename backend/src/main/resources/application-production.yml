spring:
  config:
    activate:
      on-profile: production
  docker:
    compose:
      enabled: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

worksphere:
  cors:
    allowed-origins: ${FRONTEND_ORIGIN}
  security:
    auto-verify-registration: false
    cookies:
      secure: true
    session:
      idle-timeout: ${SESSION_IDLE_TIMEOUT:30m}
      absolute-timeout: ${SESSION_ABSOLUTE_TIMEOUT:12h}
      touch-interval: ${SESSION_TOUCH_INTERVAL:5m}
    login-rate-limit:
      account-maximum-attempts: ${LOGIN_ACCOUNT_MAX_ATTEMPTS:5}
      source-maximum-attempts: ${LOGIN_SOURCE_MAX_ATTEMPTS:100}
      window: ${LOGIN_RATE_WINDOW:10m}
      block-duration: ${LOGIN_BLOCK_DURATION:15m}
    google:
      enabled: ${GOOGLE_LOGIN_ENABLED:false}
